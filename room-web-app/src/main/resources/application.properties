spring.application.name=room-web-app
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.connection.multi_tenant_connection_provider=org.hibernate.engine.jdbc.connections.spi.DataSourceBasedMultiTenantConnectionProviderImpl
spring.jpa.hibernate.connection.provider_class=org.hibernate.engine.jdbc.connections.internal.DataSourceConnectionProvider
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.jpa.database=postgresql
spring.datasource.testWhileIdle=true
spring.datasource.timeBetweenEvictionRunsMillis=3600000
spring.datasource.validationQuery=SELECT 1
#spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/local?currentSchema=public&autoReconnect=true&socketTimeout=300000
spring.jpa.hibernate.hikari.schema=public
spring.jpa.hibernate.hikari.autoCommit=false
spring.jpa.hibernate.hikari.validation-timeout=8000
spring.jpa.hibernate.hikari.maximum-pool-size=300
spring.jpa.hibernate.hikari.minimumIdle=5
spring.jpa.hibernate.hikari.maxLifetime=179999
spring.jpa.hibernate.hikari.idleTimeout=60000
spring.jpa.hibernate.hikari.connectionTimeout=30000
spring.jpa.hibernate.hikari.keepaliveTime=74000
server.port=8080
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
debug=true
