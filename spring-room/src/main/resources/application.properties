spring.application.name=spring-room
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/local?socketFactory=org.newsclub.net.unix.AFUNIXSocketFactory%24FactoryArg&socketFactoryArg=/mnt/wsl/pg_sockets/.s.PGSQL.5432&sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.data.rest.base-path=api/rest
management.endpoints.web.exposure.include=*
management.endpoint.health.roles=USER, ADMIN
management.endpoint.health.show-details=when_authorized